version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  signal-service:
    build:
      context: .
      dockerfile: Dockerfile.signal-service
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - TRADINGVIEW_MCP_URL=${TRADINGVIEW_MCP_URL}
    restart: unless-stopped

  trade-service:
    build:
      context: .
      dockerfile: Dockerfile.trade-service
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=production
      - PORT=4002
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - BINANCE_TESTNET_API_KEY=${BINANCE_TESTNET_API_KEY}
      - BINANCE_TESTNET_API_SECRET=${BINANCE_TESTNET_API_SECRET}
    restart: unless-stopped

  tradingview-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TRADINGVIEW_BROWSER_ENABLED=true
      - TRADINGVIEW_BROWSER_HEADLESS=true
      - TRADINGVIEW_BROWSER_USER_DATA_DIR=/data/tradingview-profile
      - TRADINGVIEW_BROWSER_STARTUP_TIMEOUT_MS=30000
      - TRADINGVIEW_BROWSER_URL=https://www.tradingview.com/chart/
      - CDP_HOST=127.0.0.1
      - CDP_PORT=9222
    volumes:
      - tradingview-profile:/data
    restart: unless-stopped
    # CDP (9222) is intentionally not published.

  analysis-service:
    build:
      context: .
      dockerfile: Dockerfile.analysis-service
    ports:
      - "4003:4003"
    environment:
      - NODE_ENV=production
      - PORT=4003
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped

volumes:
  tradingview-profile:
